{% extends "base.html" %}
{% block content %}
<h1>⚙️ Баптаулар</h1>

<div class="stats">
  <div class="stat-card"><div class="num">{{ total_commission }} тг</div><div class="label">💼 Жиналған комиссия (барлық уақыт)</div></div>
</div>

<form method="POST" class="card" style="max-width:420px;">
  <label class="field-label">Комиссия пайызы (%)</label>
  <p class="hint">Аяқталған әр сапардан алынатын пайыз. Есептеу үшін ғана — жолаушыдан/жүргізушіден автоматты ұсталмайды.</p>
  <input type="number" step="0.1" min="0" max="100" name="commission_percent" value="{{ commission_percent }}" style="margin-bottom:16px;">
  <button type="submit" class="btn btn-primary" style="padding:10px 20px; font-size:14px;">Сақтау</button>
</form>
{% endblock %}
